<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>ありがとうございました — みよこみ</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #FAFAF8; color: #3E2723;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 16px; padding: 32px 24px 28px;
    box-shadow: 0 3px 10px rgba(20,18,12,.09); text-align: center;
  }
  .mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 999px;
          display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 19px; margin: 0 0 8px; letter-spacing: .02em; }
  .lead { font-size: 13.5px; font-weight: 600; color: #4E342E; margin: 0 0 14px; }
  p.body { font-size: 13px; line-height: 1.95; color: #7D6660; margin: 0; }
  .brand { margin-top: 26px; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #A1887F; }
  .mark { background: #F9DB02; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#3E2723" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>ありがとうございました</h1>
    <p class="lead">変更内容は保存されています。</p>
    <p class="body">反映まで少し時間がかかる場合があります。<br />アプリを開いて「運営メニュー」から現在の状態をご確認ください。</p>
    <div class="brand">みよこみ</div>
  </main>
</body>
</html>
